name: Daily iOS VPN Monitor & Resend Email

on:
  schedule:
    - cron: '0 1 * * *'  # 北京时间每天上午 9:00 (UTC 1:00) 自动触发
  workflow_dispatch:      # 支持手动一键触发

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # 切换到 Node 22，不再提示 Node 20 废弃警告

      - name: Install Dependencies
        run: npm install      # 不强求 package-lock.json，直接安装 package.json 里的依赖

      - name: Run Script & Send Email via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node index.js
