name: Daily iOS VPN Monitor & Resend Email

on:
  schedule:
    - cron: '0 1 * * *'  # 北京时间每天 9:00
  workflow_dispatch:      # 允许手动触发

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # 升级至最新的 LTS 版本，解决 Node 20 弃用警告

      - name: Install Dependencies
        run: npm install      # 使用 npm install（即使没有 lock 文件也会自动安装）

      - name: Run Script & Send Email via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node index.js
