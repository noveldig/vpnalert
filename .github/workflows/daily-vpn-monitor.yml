name: Daily iOS VPN Monitor & Resend Notification

on:
  schedule:
    - cron: '0 1 * * *' # 每天 UTC 1:00 (北京时间 9:00) 自动触发
  workflow_dispatch: # 支持手动点按运行

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Resend
        run: npm install resend

      - name: Run Script & Send Email
        run: node index.js
